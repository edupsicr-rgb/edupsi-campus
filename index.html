 return `<button class="card fcard" data-a="fopen" data-id="${f.id}" style="text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px"><span style="color:${f.color||'var(--brand)'}">${ic('folder','ico fico')}</span><span style="min-width:0;flex:1"><b style="font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><span class="small muted">${folderSize(f.id)} archivo${folderSize(f.id)===1?'':'s'}${st?' · '+esc(short(st.name)):''}${f.owner!==ui.user.id?' · de '+esc(short(UP(f.owner).name)):''}</span>${sh.length?`<span class="small" style="display:block;color:var(--brand)">${ic('share','ico sm')} ${esc(sh.slice(0,3).join(', '))}${sh.length>3?' y '+(sh.length-3)+' más':''}</span>`:''}</span></button>`}
VIEWS.files=()=>{const u=ui.user;const all=S.folders||[];const cur=FD(FS.sel);
 const css=`<style>.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.fico{width:30px;height:30px}.ico.sm{width:13px;height:13px;vertical-align:-2px}.fcard:hover{border-color:var(--brand)}.ftype{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--brand-soft,rgba(90,155,207,.14));color:var(--brand);font-size:10px;font-weight:700;flex:none}</style>`;
 if(FS.q){const q=FS.q.toLowerCase();const fs=(S.files||[]).filter(x=>x.name.toLowerCase().includes(q));const fo=all.filter(f=>f.name.toLowerCase().includes(q));
  return css+filesHead(null)+`<div class="card row" style="justify-content:space-between"><span>Resultados para “<b>${esc(FS.q)}</b>”</span><button class="btn sm" data-a="fsclear">Limpiar búsqueda</button></div>${fo.length?`<div class="fgrid">${fo.map(folderCard).join('')}</div>`:''}${fileTable(fs,true)}`}
 if(!cur){const roots=all.filter(f=>!f.parent||!FD(f.parent));
  const mine=roots.filter(f=>f.owner===u.id&&!f.student),studs=roots.filter(f=>f.student),shared=roots.filter(f=>f.owner!==u.id&&!f.student);
  const sec=(t,xs,empty)=>`<div class="stack"><h2 style="font-size:16px">${t}</h2>${xs.length?`<div class="fgrid">${xs.map(folderCard).join('')}</div>`:`<p class="small muted">${empty}</p>`}</div>`;
  return css+filesHead(null)+(u.role==='guardian'||u.role==='student'?sec('Compartidas conmigo',roots,'Aún no hay carpetas compartidas contigo.'):
   sec('Mis carpetas',mine,'Crea carpetas para tus plantillas, materiales y documentos de trabajo.')+sec('Carpetas de estudiantes',studs,'Crea la carpeta de un estudiante desde aquí o desde su expediente.')+sec('Compartidas conmigo',shared,'Cuando alguien comparta una carpeta contigo, aparecerá aquí.'))}
 const path=folderPath(cur),edit=canFolder(cur,'editar'),subs=subFolders(cur.id),fs=filesIn(cur.id).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
 return css+filesHead(cur)+`<div class="crumb"><button data-a="fopen" data-id="">Documentos</button>${path.map((f,i)=>i<path.length-1?` / <button data-a="fopen" data-id="${f.id}">${esc(f.name)}</button>`:` / <b>${esc(f.name)}</b>`).join('')}</div>
  <div class="card row" style="justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="row" style="gap:10px"><span style="color:${cur.color||'var(--brand)'}">${ic('folder','ico fico')}</span><div><b style="font-size:17px">${esc(cur.name)}</b><div class="small muted">Creada por ${esc(UP(cur.owner).name)}${cur.student?' · Estudiante: '+esc(UP(cur.student).name):''} · ${edit?'Puedes editar':'Solo lectura'}</div></div></div>
  <div class="row">${edit?`<label class="btn pri" style="cursor:pointer">${ic('upload')}Subir archivos<input type="file" multiple data-ch="fupload" data-id="${cur.id}" style="display:none"></label><button class="btn" data-a="fnew" data-p="${cur.id}">${ic('plus')}Subcarpeta</button><button class="btn" data-a="fshare" data-id="${cur.id}">${ic('share')}Compartir</button><button class="btn" data-a="fren" data-id="${cur.id}" aria-label="Renombrar">${ic('edit')}</button>${canDelFolder(cur)?`<button class="btn danger" data-a="fdelask" data-id="${cur.id}" aria-label="Eliminar carpeta">${ic('trash')}</button>`:''}`:''}</div></div>
  ${shareSummary(cur).length?`<p class="small muted">${ic('share','ico sm')} Compartida con: ${esc(shareSummary(cur).join(', '))}</p>`:''}
  ${subs.length?`<div class="fgrid">${subs.map(folderCard).join('')}</div>`:''}
  ${fileTable(fs,false,edit)}
  ${edit?`<div id="fdrop" data-id="${cur.id}" class="card" style="border-style:dashed;text-align:center;padding:22px;color:var(--muted)">${ic('upload')} Arrastra aquí archivos para subirlos a esta carpeta (máximo 50 MB cada uno). Si subes un archivo con el mismo nombre, se guarda como una versión nueva.</div>`:''}`};
function filesHead(cur){const u=ui.user;const staff=u.role==='superadmin'||u.role==='teacher';
 return `<div class="head"><div><h1>${u.role==='guardian'?'Carpetas compartidas':'Documentos'}</h1><p>${u.role==='guardian'?'Documentos que EduPsi comparte con tu familia.':'Carpetas por estudiante y de trabajo, con permisos para compartir con el equipo o las familias.'}</p></div>
 <div class="row"><input class="inp" style="width:220px" placeholder="Buscar archivos…" value="${esc(FS.q)}" data-ch="fsearch" aria-label="Buscar archivos">${staff&&!cur?`<button class="btn" data-a="fnewstudent">${ic('users')}Carpeta de estudiante</button><button class="btn pri" data-a="fnew" data-p="">${ic('plus')}Nueva carpeta</button>`:''}</div></div>`}
function fileTable(fs,showFolder,edit){if(!fs.length)return showFolder?'<p class="muted">No se encontraron archivos.</p>':'<div class="card"><span class="muted">Esta carpeta no tiene archivos todavía.</span></div>';
 return `<div class="card flush"><div class="tbl-wrap"><table><thead><tr><th>Archivo</th>${showFolder?'<th>Carpeta</th>':''}<th>Versión</th><th>Tamaño</th><th>Actualizado</th><th class="r"></th></tr></thead><tbody>${fs.map(x=>{const f=FD(x.folder),e=edit===undefined?canFolder(f,'editar'):edit;return `<tr><td><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="ftype">${extIcon(x.name)}</span><div style="min-width:0"><b style="font-weight:500;word-break:break-word">${esc(x.name)}</b><div class="small muted">Subido por ${esc(short(UP(x.by).name))}</div></div></div></td>${showFolder?`<td class="small"><button class="btn ghost sm" data-a="fopen" data-id="${x.folder}">${esc(f?.name||'')}</button></td>`:''}<td class="num">v${(x.versions||[]).length||1}</td><td class="small num">${fsize(x.size||0)}</td><td class="small muted">${fd(String(x.at).slice(0,10))} · ${esc(short(UP(x.upby||x.by).name))}</td>
  <td class="r"><div class="row end" style="flex-wrap:nowrap"><button class="btn sm" data-a="fdl" data-id="${x.id}">${ic('download')}Abrir</button>${(x.versions||[]).length>1?`<button class="btn sm" data-a="fvers" data-id="${x.id}" aria-label="Versiones">${ic('history')}</button>`:''}${e?`<button class="btn sm danger" data-a="fdelfile" data-id="${x.id}" aria-label="Eliminar archivo">${ic('trash')}</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div></div>`}
function canDelFolder(f){return isAdminU(ui.user)||f.owner===ui.user.id}

// ---------- navegación y búsqueda ----------
ACT.fopen=d=>{FS.sel=d.id||null;FS.q='';ui.view='files';ui.pop=null;render();window.scrollTo(0,0)};
ACT.fsclear=()=>{FS.q='';render()};
CH.fsearch=el=>{FS.q=el.value.trim();render()};

// ---------- crear, renombrar, compartir ----------
ACT.fnew=d=>openModal({title:d.p?'Nueva subcarpeta':'Nueva carpeta',form:'fnew',ok:'Crear',body:`<div class="form"><input type="hidden" name="p" value="${esc(d.p||'')}"><div class="field"><label for="fn1">Nombre</label><input id="fn1" name="n" class="inp" required data-autofocus placeholder="Ej.: Plantillas de informes"></div>
 <div class="field"><label>Color</label><div class="row">${['#5A9BCF','#A6B321','#E0A93B','#C0453B','#8A5CB8','#3B7A8C'].map((c,i)=>`<label class="check"><input type="radio" name="c" value="${c}" ${i===0?'checked':''}><span style="display:inline-block;width:20px;height:20px;border-radius:6px;background:${c}"></span></label>`).join('')}</div></div></div>`});
FORMS.fnew=fd_=>{const p=fd_.get('p')||null;const par=FD(p);const f={id:nid('fo'),name:fd_.get('n').trim(),color:fd_.get('c'),owner:ui.user.id,student:null,parent:p,shares:[],at:nowStr()};
 S.folders.push(f);log('Creó carpeta',f.name+(par?' · en '+par.name:''));save();ui.modal=null;toast('Carpeta creada');FS.sel=p?p:f.id;render()};
ACT.fnewstudent=()=>{const ids=myCases().filter(s=>!(S.folders||[]).some(f=>f.student===s&&!f.parent));if(!ids.length){toast('Todos tus estudiantes ya tienen carpeta');return}
 openModal({title:'Carpeta de estudiante',form:'fstud',ok:'Crear carpeta',body:`<div class="form"><div class="field"><label for="fs1">Estudiante</label><select id="fs1" name="s" class="inp">${ids.map(s=>`<option value="${s}">${esc(UP(s).name)}</option>`).join('')}</select></div><label class="check"><input type="checkbox" name="fam"> Visible para la familia (solo lectura)</label><p class="small muted">El equipo del estudiante la ve automáticamente. Se crean subcarpetas para Informes, Evaluaciones y Materiales.</p></div>`})};
function ensureStudentFolder(sid,fam){let f=(S.folders||[]).find(x=>x.student===sid&&!x.parent);if(f)return f;
 f={id:nid('fo'),name:UP(sid).name,color:'#A6B321',owner:ui.user.id,student:sid,parent:null,family:!!fam,shares:[],at:nowStr()};S.folders.push(f);
 ['Informes','Evaluaciones','Materiales'].forEach(n=>S.folders.push({id:nid('fo'),name:n,color:'#5A9BCF',owner:ui.user.id,student:null,parent:f.id,shares:[],at:nowStr()}));
 log('Creó carpeta de estudiante',UP(sid).name);return f}
FORMS.fstud=fd_=>{const f=ensureStudentFolder(fd_.get('s'),!!fd_.get('fam'));save();ui.modal=null;toast('Carpeta creada');FS.sel=f.id;render()};
ACT.fren=d=>{const f=FD(d.id);openModal({title:'Renombrar carpeta',form:'fren',ok:'Guardar',body:`<div class="form"><input type="hidden" name="id" value="${f.id}"><div class="field"><label for="fr1">Nombre</label><input id="fr1" name="n" class="inp" required data-autofocus value="${esc(f.name)}"></div></div>`})};
FORMS.fren=fd_=>{const f=FD(fd_.get('id'));const old=f.name;f.name=fd_.get('n').trim();log('Renombró carpeta',`${old} → ${f.name}`);save();ui.modal=null;render()};
ACT.fshare=d=>{const f=FD(d.id);const people=S.users.filter(x=>x.id!==ui.user.id&&x.id!==f.owner&&['activo','invitado'].includes(x.status)&&x.role!=='student').sort((a,b)=>a.name.localeCompare(b.name));
 openModal({title:'Compartir “'+f.name+'”',form:'fshare',ok:'Agregar',wide:true,body:`<input type="hidden" name="id" value="${f.id}"><div class="stack">
  <div class="list">${f.student?`<div class="it">${ic('users')}<div class="grow"><b style="font-weight:500">Equipo de ${esc(short(UP(f.student).name))}</b><div class="small muted">Acceso automático según el expediente</div></div><span class="pill">Automático</span></div>
   <div class="it">${ic('users')}<div class="grow"><b style="font-weight:500">Familia de ${esc(short(UP(f.student).name))}</b><div class="small muted">${famOf(f.student).map(g=>esc(g.name)).join(', ')||'Sin cuenta familiar vinculada'}</div></div><button type="button" class="btn sm ${f.family?'':'pri'}" data-a="ffam" data-id="${f.id}">${f.family?'Dejar de compartir':'Compartir (solo ver)'}</button></div>`:''}
   ${(f.shares||[]).map((s,i)=>`<div class="it">${s.t==='user'?av(UP(s.id)):ic('users')}<div class="grow"><b style="font-weight:500">${esc(s.t==='user'?UP(s.id).name:(ROLE_SHARE.find(r=>r[0]===s.id)||[0,s.id])[1])}</b><div class="small muted">${s.t==='user'?roleLabel(UP(s.id)):'Grupo'}</div></div><select class="inp" style="width:auto" data-ch="fperm" data-id="${f.id}" data-i="${i}" aria-label="Permiso"><option value="ver" ${s.perm!=='editar'?'selected':''}>Puede ver</option><option value="editar" ${s.perm==='editar'?'selected':''}>Puede editar</option></select><button type="button" class="btn sm" data-a="funshare" data-id="${f.id}" data-i="${i}">Quitar</button></div>`).join('')||(!f.student?'<p class="small muted">Todavía no se comparte con nadie.</p>':'')}</div>
  <div class="card stack" style="background:var(--surface-2)"><b>Agregar acceso</b><div class="form"><div class="two"><div class="field"><label for="sh1">Persona o grupo</label><select id="sh1" name="who" class="inp"><optgroup label="Personas">${people.map(x=>`<option value="user:${x.id}">${esc(x.name)} · ${roleLabel(x)}</option>`).join('')}</optgroup><optgroup label="Grupos">${ROLE_SHARE.map(r=>`<option value="role:${r[0]}">${r[1]}</option>`).join('')}</optgroup></select></div>
  <div class="field"><label for="sh2">Permiso</label><select id="sh2" name="perm" class="inp"><option value="ver">Puede ver y descargar</option><option value="editar">Puede ver, subir y organizar</option></select></div></div></div>
  <p class="small muted">Los permisos se heredan: quien tiene acceso a esta carpeta también ve sus subcarpetas. El grupo “Todas las familias” es para materiales generales, no para documentos de un estudiante.</p></div></div>`})};
FORMS.fshare=fd_=>{const f=FD(fd_.get('id'));const [t,id]=String(fd_.get('who')).split(':');if(!id)return;f.shares=f.shares||[];
 if(f.shares.some(s=>s.t===t&&s.id===id)){toast('Ya tiene acceso');return}
 if(t==='role'&&id==='guardian'&&f.student){toast('Para un estudiante, usa “Familia de…” en lugar de todas las familias');return}
 f.shares.push({t,id,perm:fd_.get('perm')});if(t==='user')notify(id,`${short(ui.user.name)} compartió contigo la carpeta “${f.name}”`);
 log('Compartió carpeta',`${f.name} · ${t==='user'?UP(id).name:(ROLE_SHARE.find(r=>r[0]===id)||[0,id])[1]} (${fd_.get('perm')})`);save();ACT.fshare({id:f.id});toast('Acceso agregado')};
ACT.funshare=d=>{const f=FD(d.id);const s=f.shares[+d.i];f.shares.splice(+d.i,1);log('Quitó acceso a carpeta',`${f.name} · ${s.t==='user'?UP(s.id).name:s.id}`);save();ACT.fshare({id:f.id})};
CH.fperm=el=>{const f=FD(el.dataset.id);f.shares[+el.dataset.i].perm=el.value;log('Cambió permiso de carpeta',f.name);save();toast('Permiso actualizado')};
ACT.ffam=d=>{const f=FD(d.id);f.family=!f.family;if(f.family)famOf(f.student).forEach(g=>notify(g.id,`EduPsi compartió contigo la carpeta “${f.name}”`));log(f.family?'Compartió carpeta con la familia':'Dejó de compartir carpeta con la familia',f.name);save();ACT.fshare({id:f.id})};

// ---------- subir archivos (con versiones) ----------
function safeName(n){return String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-120)}
async function uploadFiles(fid,list){const f=FD(fid);if(!f||!canFolder(f,'editar')){toast('No tienes permiso para subir aquí');return}
 const files=[...list];let ok=0;
 for(const file of files){if(file.size>50*1048576){toast(`“${file.name}” supera 50 MB`);continue}
  toast(`Subiendo ${file.name}…`);let rec=filesIn(fid).find(x=>x.name===file.name);const id=rec?rec.id:nid('fi');const v=rec?(rec.versions||[]).length+1:1;
  const path=`${fid}/${id}/v${v}-${safeName(file.name)}`;const {error}=await SB.storage.from('files').upload(path,file,{contentType:file.type||'application/octet-stream'});
  if(error){toast('No se pudo subir '+file.name+': '+error.message);continue}
  const ver={v,path,size:file.size,at:nowStr(),by:ui.user.id};
  if(rec){rec.versions=[...(rec.versions||[]),ver];rec.path=path;rec.size=file.size;rec.at=ver.at;rec.upby=ui.user.id;rec.type=file.type||'';log('Subió versión nueva',`${file.name} (v${v}) · ${f.name}`)}
  else{S.files.push({id,folder:fid,name:file.name,type:file.type||'',size:file.size,path,at:ver.at,by:ui.user.id,upby:ui.user.id,versions:[ver]});log('Subió archivo',`${file.name} · ${f.name}`)}
  ok++}
 if(ok){if(f.family||folderPath(f).some(x=>x.family)){const st=folderPath(f).find(x=>x.student);if(st)famOf(st.student).forEach(g=>notify(g.id,`Hay ${ok===1?'un documento nuevo':ok+' documentos nuevos'} en “${f.name}”`))}
  (f.shares||[]).filter(s=>s.t==='user').forEach(s=>notify(s.id,`${short(ui.user.name)} subió ${ok===1?'un archivo':ok+' archivos'} a “${f.name}”`));
  save();toast(ok===1?'Archivo subido':`${ok} archivos subidos`);render()}}
CH.fupload=el=>{uploadFiles(el.dataset.id,el.files);el.value=''};
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#fdrop');if(z){e.preventDefault();z.style.borderColor='var(--brand)'}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#fdrop');if(z)z.style.borderColor=''});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#fdrop');if(z){e.preventDefault();z.style.borderColor='';uploadFiles(z.dataset.id,e.dataTransfer.files)}});

// ---------- abrir, versiones y eliminar ----------
async function signedOpen(x,path,label){const {data,error}=await SB.storage.from('files').createSignedUrl(path,300,{download:false});if(error){toast('No se pudo abrir el archivo');return}
 log('Abrió archivo',`${x.name}${label?' ('+label+')':''} · ${FD(x.folder)?.name||''}`);save();
 openModal({title:x.name,form:'none',ok:false,body:`<div class="stack"><p class="muted">${fsize(x.size||0)} · ${label||'versión actual'} · ${fdl(String(x.at).slice(0,10))}</p>${/^image\//.test(x.type||'')?`<img src="${data.signedUrl}" alt="${esc(x.name)}" style="max-width:100%;border-radius:12px">`:''}<a class="btn pri" style="align-self:flex-start" href="${data.signedUrl}" target="_blank" rel="noopener">${ic('download')}Abrir o descargar</a><p class="small muted">El enlace es privado y vence en 5 minutos. Cada apertura queda en la auditoría.</p></div>`})}
ACT.fdl=d=>{const x=(S.files||[]).find(y=>y.id===d.id);if(x)signedOpen(x,x.path,'')};
ACT.fvers=d=>{const x=(S.files||[]).find(y=>y.id===d.id);openModal({title:'Versiones de '+x.name,form:'none',ok:false,body:`<div class="list">${[...(x.versions||[])].reverse().map((v,i)=>`<div class="it"><span class="pill ${i===0?'good':''}">v${v.v}</span><div class="grow">${i===0?'Versión actual':'Versión anterior'}<div class="small muted">${fd(String(v.at).slice(0,10))} ${String(v.at).slice(11)} · ${esc(short(UP(v.by).name))} · ${fsize(v.size||0)}</div></div><button class="btn sm" data-a="fdlv" data-id="${x.id}" data-v="${v.v}">${ic('download')}Abrir</button></div>`).join('')}</div>`})};
ACT.fdlv=d=>{const x=(S.files||[]).find(y=>y.id===d.id);const v=(x.versions||[]).find(z=>String(z.v)===String(d.v));if(v)signedOpen(x,v.path,'versión '+v.v)};
async function hardDelete(fileRecs,folderIds){const paths=fileRecs.flatMap(x=>(x.versions||[]).map(v=>v.path).concat(x.path?[x.path]:[]));
 if(paths.length){const {error}=await SB.storage.from('files').remove([...new Set(paths)]);if(error)console.warn('storage',error.message)}
 const fids=fileRecs.map(x=>x.id);if(fids.length){const {error}=await SB.from('files').delete().in('id',fids);if(error){toast('No se pudo eliminar: '+error.message);return false}}
 for(const id of [...folderIds].reverse()){const {error}=await SB.from('folders').delete().eq('id',id);if(error){toast('No se pudo eliminar la carpeta: '+error.message);return false}}
 S.files=S.files.filter(x=>!fids.includes(x.id));S.folders=S.folders.filter(f=>!folderIds.includes(f.id));
 fids.forEach(id=>{if(SYNC.snap.files)delete SYNC.snap.files[id]});folderIds.forEach(id=>{if(SYNC.snap.folders)delete SYNC.snap.folders[id]});return true}
ACT.fdelfile=d=>{const x=(S.files||[]).find(y=>y.id===d.id);openModal({title:'Eliminar archivo',form:'fdelfile',ok:'Sí, eliminar',body:`<input type="hidden" name="id" value="${x.id}"><p>¿Eliminar <b>${esc(x.name)}</b>${(x.versions||[]).length>1?` y sus ${(x.versions||[]).length} versiones`:''}? No se puede deshacer.</p>`})};
FORMS.fdelfile=async fd_=>{const x=(S.files||[]).find(y=>y.id===fd_.get('id'));if(!x)return;if(await hardDelete([x],[])){log('Eliminó archivo',`${x.name} · ${FD(x.folder)?.name||''}`);save();ui.modal=null;toast('Archivo eliminado');render()}};
function descendants(fid){const out=[fid];subFolders(fid).forEach(s=>out.push(...descendants(s.id)));return out}

 return c.sections.map((s,si)=>`<div class="card"><div class="card-h"><h2>${esc(s.title)}</h2><div class="row" style="gap:4px">${ed?`<button class="btn sm" data-a="secmove" data-s="${s.id}" data-d="-1" ${si===0?'disabled':''} aria-label="Subir unidad">${ic('up')}</button><button class="btn sm" data-a="secmove" data-s="${s.id}" data-d="1" ${si===n-1?'disabled':''} aria-label="Bajar unidad">${ic('down')}</button><button class="btn sm" data-a="secedit" data-s="${s.id}" aria-label="Renombrar unidad">${ic('edit')}</button><button class="btn sm danger" data-a="secdel" data-s="${s.id}" aria-label="Eliminar unidad">${ic('trash')}</button>`:''}<span class="small muted" style="margin-left:6px">${s.lessons.length} lección${s.lessons.length===1?'':'es'}</span></div></div>
 <div>${s.lessons.map((l,li)=>`<div class="lrow">${ic(ltIcon(l.type))}<div class="grow" style="min-width:0"><b style="font-weight:500">${esc(l.title)}</b><div class="small muted" style="margin-top:3px">${esc((LTYPES.find(t=>t[0]===l.type)||[0,l.type])[1])}${l.dur?' · '+l.dur+' min':''} ${lessonBadges(l)}</div></div>
  <div class="tools"><button class="btn sm" data-a="lprev" data-c="${c.id}" data-l="${l.id}" aria-label="Ver lección">${ic('eye')}</button>${ed?`<button class="btn sm" data-a="lmove" data-s="${s.id}" data-id="${l.id}" data-d="-1" ${li===0?'disabled':''} aria-label="Subir">${ic('up')}</button><button class="btn sm" data-a="lmove" data-s="${s.id}" data-id="${l.id}" data-d="1" ${li===s.lessons.length-1?'disabled':''} aria-label="Bajar">${ic('down')}</button><button class="btn sm" data-a="ledit" data-s="${s.id}" data-id="${l.id}" aria-label="Editar lección">${ic('edit')}</button><button class="btn sm danger" data-a="ldel" data-s="${s.id}" data-id="${l.id}" aria-label="Eliminar lección">${ic('trash')}</button>`:''}</div></div>`).join('')||'<p class="muted small" style="padding:8px 0">Esta unidad aún no tiene lecciones.</p>'}</div>
 ${ed?`<button class="btn sm pri" style="margin-top:12px" data-a="ledit" data-s="${s.id}">${ic('plus')}Agregar lección o contenido</button>`:''}</div>`).join('')+
 (ed?`<form class="card row" data-f="addsection"><input name="title" class="inp" style="flex:1;min-width:200px" placeholder="Nombre de una nueva unidad" required><button class="btn">${ic('plus')}Agregar unidad</button></form>`:'')}
const _co27=VIEWS.course;VIEWS.course=()=>{const c=C(ui.p);if(!c)return '<div class="empty">Este curso ya no existe.</div>';let h=_co27();const t=ui.tab||'contenido';const ed=canEditCourse(c);
 const i=h.indexOf('<div class="tabs" role="tablist">');if(i<0)return h;const e=h.indexOf('</div>',i)+6;let tabs=h.slice(i,e),body=h.slice(e);

 <div class="row">${ed?`<button class="btn" data-a="editcourse" data-id="${c.id}">${ic('edit')}Editar curso</button><button class="btn" data-a="coursestatus" data-id="${c.id}">${c.status==='publicado'?'Pasar a borrador':'Publicar'}</button>`:''}${isAdminU(ui.user)?`<button class="btn" data-a="go" data-v="enroll" data-p="${c.id}">${ic('userplus')}Matricular</button><button class="btn danger" data-a="delcourse" data-id="${c.id}" aria-label="Eliminar curso">${ic('trash')}</button>`:''}</div></div></div>`;
 if(t==='contenido')body=courseContent(c);
 if(t==='clases'){const xs=S.live.filter(v=>v.c===c.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));body=`${ed?`<div class="row end"><button class="btn pri" data-a="schedulelive" data-c="${c.id}">${ic('video')}Programar videoclase</button></div>`:''}<div class="card"><div class="list">${xs.map(v=>`<div class="it">${ic('video')}<div class="grow"><b style="font-weight:500">${esc(v.title)}</b><div class="small muted">${fdl(v.date)} · ${v.time} · ${esc(v.provider||'Sala EduPsi')}</div></div><button class="btn sm vc" data-a="joinlive" data-id="${v.id}">${ic('video')}${ed?'Iniciar':'Unirse'}</button>${ed?`<button class="btn sm danger" data-a="dellive" data-id="${v.id}" aria-label="Eliminar videoclase">${ic('trash')}</button>`:''}</div>`).join('')||'<span class="muted">No hay videoclases programadas.</span>'}</div></div>`}

 <div class="field"><label for="lf">Archivos (PDF, Word, PowerPoint, imágenes, audio… hasta 50 MB cada uno)</label><input id="lf" type="file" multiple class="inp">${(l.files||[]).length?`<div class="stack" style="gap:4px;margin-top:6px">${l.files.map((f,i)=>`<label class="check"><input type="checkbox" name="rm" value="${i}"> Quitar ${esc(f.name)} <span class="small muted">(${esc(f.size||'')})</span></label>`).join('')}</div>`:''}</div></div>`})};
FORMS.lesson=async(fd_,form)=>{const c=C(ui.p),s=SEC(fd_.get('s'));if(!c||!s)return;const id=fd_.get('id');let l=id?s.lessons.find(x=>x.id===id):null;const isNew=!l;if(isNew)l={id:nid('l'),files:[]};

 const rm=fd_.getAll('rm').map(Number);const keep=(l.files||[]).filter((f,i)=>!rm.includes(i));const gone=(l.files||[]).filter((f,i)=>rm.includes(i)).map(f=>f.path).filter(Boolean);

function embedOf(url){if(!url)return '';let m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i);if(m)return `<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="Video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
 m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);if(m)return `<div class="embed"><iframe src="https://player.vimeo.com/video/${m[1]}" title="Video" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;

async function mfaTrustSave(){const uid=await authUid();if(!uid)return;const tok=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');try{const {error}=await SB.rpc('mfa_trust_add',{p_token:tok,p_label:(typeof devStr==='function'?devStr():navigator.platform)});if(!error){const m=trustMap();m[uid]=tok;LS.set('edupsi-trust',JSON.stringify(m))}}catch(e){}}

var MAIL={rows:[],loaded:false,loading:false,box:'in',folder:null,sel:null,q:'',folders:[],draft:null,err:''};
const MAIL_BOXES=[['in','Entrada','inbox'],['unread','No leídos','mail'],['sent','Enviados','send'],['draft','Borradores','draft'],['important','Importantes','tag'],['star','Destacados','star'],['trash','Eliminados','trash']];
function mailNewId(){return ui.user.id+'~'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function mailUnread(){return MAIL.rows.filter(r=>r.box==='in'&&!r.read&&!r.trash).length}
async function mailLoad(quiet){if(!ui.user||typeof SB==='undefined'||!SB)return;MAIL.loading=true;try{const [l,f]=await Promise.all([SB.rpc('mail_list'),SB.from('mail_folders').select('*')]);
  if(l.error){MAIL.err=l.error.message}else{MAIL.rows=(l.data||[]).map(r=>({...r,data:r.data||{}}));MAIL.err=''}
  if(!f.error)MAIL.folders=(f.data||[]).sort((a,b)=>a.name.localeCompare(b.name));MAIL.loaded=true}catch(e){MAIL.err='No se pudo cargar el buzón'}
 MAIL.loading=false;if(!quiet||ui.view==='messages')render();else{const b=document.querySelector('[data-a="go"][data-v="messages"] .badge');const n=mailUnread();if(!!b!==!!n)render()}}
function mailFilter(){const q=MAIL.q.trim().toLowerCase();let xs=MAIL.rows;const b=MAIL.box;
 if(MAIL.folder)xs=xs.filter(r=>r.folder===MAIL.folder&&!r.trash);
 else if(b==='in')xs=xs.filter(r=>r.box==='in'&&!r.trash&&!r.folder);
 else if(b==='unread')xs=xs.filter(r=>r.box==='in'&&!r.read&&!r.trash);
 else if(b==='sent')xs=xs.filter(r=>r.box==='sent'&&!r.trash&&!r.folder);
 else if(b==='draft')xs=xs.filter(r=>r.box==='draft'&&!r.trash);
 else if(b==='important')xs=xs.filter(r=>r.important&&!r.trash);
 else if(b==='star')xs=xs.filter(r=>r.star&&!r.trash);
 else if(b==='trash')xs=xs.filter(r=>r.trash);
 if(q)xs=xs.filter(r=>[r.data.subject,r.data.body,r.sender_name,(r.to_names||[]).join(' ')].join(' ').toLowerCase().includes(q));
 return xs}
function mailWhen(at){const d=new Date(at);if(isNaN(d))return '';const t=d.toLocaleDateString('sv-SE',{timeZone:'America/Costa_Rica'});return t===TODAY?d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Costa_Rica'}):fd(t)}
function mailWhenLong(at){const d=new Date(at);if(isNaN(d))return '';return d.toLocaleString('es-CR',{dateStyle:'long',timeStyle:'short',timeZone:'America/Costa_Rica'})}
function mailWho(r){return r.box==='in'?(r.sender_name||'EduPsi'):('Para: '+((r.to_names||[]).join(', ')||'(sin destinatarios)'))}
function mailBody(t){return esc(t||'').replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}

 const list=`<div class="mb-search"><input class="inp" type="search" placeholder="Buscar en ${esc(title)}" aria-label="Buscar mensajes" value="${esc(MAIL.q)}" id="mbq"><button class="iconbtn" data-a="mailreload" aria-label="Actualizar">${ic('restore')}</button></div>`

 ${MAIL.err?`<div class="card" style="color:#B42318">${esc(MAIL.err)}</div>`:''}

function mailReadHtml(r){const d=r.data;const f=(d.files||[]);const fopts=MAIL.folders.map(x=>`<option value="${x.id}" ${r.folder===x.id?'selected':''}>${esc(x.name)}</option>`).join('');
 const tools=r.trash?`<button class="btn sm" data-a="mailrestore" data-id="${r.box_id}">${ic('restore')}Restaurar</button><button class="btn sm danger" data-a="mailpurge" data-id="${r.box_id}">${ic('trash')}Eliminar definitivamente</button>`

  :`${r.box==='in'?`<button class="btn sm pri" data-a="mailreply" data-id="${r.box_id}">${ic('reply')}Responder</button>`:''}${(d.to||[]).length>1||r.box==='sent'?`<button class="btn sm" data-a="mailreply" data-all="1" data-id="${r.box_id}">${ic('replyall')}Responder a todos</button>`:''}

 const sender=U(r.sender_id);
 return `<button class="btn ghost sm mb-back" data-a="mailback" style="margin-bottom:8px">${ic('back')}Volver</button><div class="mb-tools">${tools}</div>

ACT.mailbox=d=>{MAIL.box=d.b;MAIL.folder=null;MAIL.sel=null;MAIL.q='';render()};
ACT.mailfolder=d=>{MAIL.folder=d.id;MAIL.sel=null;MAIL.q='';render()};
ACT.mailback=()=>{MAIL.sel=null;render()};
ACT.mailreload=()=>mailLoad();
let MAILQT=null;function mailSearchDecorate(){const i=document.getElementById('mbq');if(!i||i.dataset.ok)return;i.dataset.ok='1';i.addEventListener('input',()=>{clearTimeout(MAILQT);MAILQT=setTimeout(()=>{MAIL.q=i.value;MAIL.sel=null;render();const j=document.getElementById('mbq');if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}},250)})}
async function mailUpd(ids,patch){ids=[].concat(ids);MAIL.rows.forEach(r=>{if(ids.includes(r.box_id))Object.assign(r,patch)});render();const {error}=await SB.from('mail_box').update(patch).in('id',ids);if(error){toast('No se pudo guardar el cambio');mailLoad(true)}}
ACT.mailopen=d=>{const r=MAIL.rows.find(x=>x.box_id===d.id);if(!r)return;MAIL.sel=r.box_id;if(r.box==='in'&&!r.read)mailUpd(r.box_id,{read:true});else render();
 if(innerWidth<=860)window.scrollTo(0,0)};
ACT.mailunread=d=>{mailUpd(d.id,{read:false});MAIL.sel=null;render()};
ACT.mailflag=d=>{const r=MAIL.rows.find(x=>x.box_id===d.id);if(r)mailUpd(r.box_id,{[d.k]:!r[d.k]})};
ACT.mailtrash=async d=>{const r=MAIL.rows.find(x=>x.box_id===d.id);if(!r)return;MAIL.sel=null;await mailUpd(r.box_id,{trash:true});toast('Movido a Eliminados')};

ACT.mailpurge=d=>openModal({title:'Eliminar definitivamente',form:'mailpurge',ok:'Eliminar',body:`<input type="hidden" name="id" value="${esc(d.id)}"><p>El mensaje se borrará de tu buzón y no se podrá recuperar. Las demás personas conservan su copia.</p>`});
FORMS.mailpurge=async fd_=>{const id=fd_.get('id');const r=MAIL.rows.find(x=>x.box_id===id);ui.modal=null;if(!r){render();return}
 const {error}=await SB.from('mail_box').delete().eq('id',id);if(error){toast('No se pudo eliminar');return}
 if(r.box==='draft'){try{await SB.from('mail').delete().eq('id',r.mail_id);const fs=(r.data.files||[]).map(f=>f.path).filter(Boolean);if(fs.length)await SB.storage.from('mail').remove(fs)}catch(e){}}
 MAIL.rows=MAIL.rows.filter(x=>x.box_id!==id);MAIL.sel=null;toast('Mensaje eliminado');render()};
CH.mailmove=el=>{const v=el.value||null;mailUpd(el.dataset.id,{folder:v});toast(v?'Movido a la carpeta':'Sacado de la carpeta')};

  else{const n=String(fd_.get('n_'+f.id)||'').trim();if(n&&n!==f.name){await SB.from('mail_folders').update({name:n}).eq('id',f.id);f.name=n}}}

function mailContacts(){const me=ui.user;const act=u=>u&&u.id!==me.id&&u.status==='activo'&&u.role!=='student';const out=new Map();const add=(u,why)=>{if(act(u)&&!out.has(u.id))out.set(u.id,{u,why})};
 const admins=S.users.filter(u=>isAdminU(u));admins.forEach(u=>add(u,'Administración'));
 const caseIds=Object.keys(S.cases||{});
 if(isAdminU(me)){S.users.forEach(u=>add(u,u.role==='guardian'?'Familia':isLimited(u)?'Externo':u.role==='teacher'?'Equipo EduPsi':''))}
 else if(me.role==='guardian'){(S.guardians[me.id]||[]).forEach(k=>{const c=CASE(k);if(!c)return;add(U(c.prof),'Profesional de '+short(UP(k).name));(c.team||[]).forEach(t=>add(U(t),'Equipo de '+short(UP(k).name)))})}
 else if(isLimited(me)){caseIds.forEach(k=>{const c=CASE(k);if(c&&(c.team||[]).includes(me.id))add(U(c.prof),'Profesional de '+short(UP(k).name))})}
 else if(me.role==='teacher'){S.users.filter(u=>u.role==='teacher'&&!isLimited(u)).forEach(u=>add(u,'Equipo EduPsi'));
  caseIds.forEach(k=>{const c=CASE(k);if(!c||!(c.prof===me.id||(c.team||[]).includes(me.id)))return;Object.entries(S.guardians).forEach(([g,ks])=>{if(ks.includes(k))add(U(g),'Familia de '+short(UP(k).name))});(c.team||[]).forEach(t=>add(U(t),isLimited(U(t))?'Externo · '+short(UP(k).name):'Equipo de '+short(UP(k).name)))})}

// ===== EduPsi Campus · Informes semanales y mensuales de lo trabajado =====
// La profesional genera el informe desde el expediente: el campus arma el borrador con lo registrado en el periodo
// (sesiones, logros, conducta, objetivos y tareas para casa), ella lo revisa y completa, y se guarda en Documentos.
// Si se comparte, la familia lo ve en su portal y recibe un aviso en el buzón y por correo.
const MESL32=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function d32(s){const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function iso32(dt){return dt.toISOString().slice(0,10)}
function addDays32(s,n){const d=d32(s);d.setUTCDate(d.getUTCDate()+n);return iso32(d)}
function weekStart32(s){const d=d32(s);const wd=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-wd);return iso32(d)}
function periods32(kind){const out=[];if(kind==='week'){let w=weekStart32(TODAY);for(let i=0;i<8;i++){const from=w,to=addDays32(w,6);out.push({from,to,label:(i===0?'Esta semana · ':i===1?'Semana anterior · ':'')+`${fd(from)} al ${fd(to)}`});w=addDays32(w,-7)}}
 else{let [y,m]=TODAY.slice(0,7).split('-').map(Number);for(let i=0;i<8;i++){const from=`${y}-${String(m).padStart(2,'0')}-01`;const last=new Date(Date.UTC(y,m,0)).getUTCDate();const to=`${y}-${String(m).padStart(2,'0')}-${last}`;
  out.push({from,to,label:`${MESL32[m-1][0].toUpperCase()+MESL32[m-1].slice(1)} ${y}${i===0?' (mes en curso)':''}`});m--;if(!m){m=12;y--}}}return out}
function canReport32(sid){const u=ui.user,c=CASE(sid);if(!u||!c||isLimited(u))return false;return isAdminU(u)||c.prof===u.id||((c.team||[]).includes(u.id)&&u.role==='teacher')}
function inP(x,from,to){const d=String(x||'').slice(0,10);return d>=from&&d<=to}

// datos del periodo
function periodData32(sid,from,to){const c=CASE(sid)||{};const ses=(c.sessions||[]).filter(x=>inP(x.date,from,to));
 const done=ses.filter(x=>x.status==='Realizada').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const abs=ses.filter(x=>['Ausente','No realizada','No asistió'].includes(x.status)).length,canc=ses.filter(x=>x.status==='Cancelada').length,next=ses.filter(x=>x.status==='Programada').length;
 const cond=(c.conduct||[]).filter(x=>inP(x.date,from,to));const pos=cond.filter(x=>x.type==='positivo'),neg=cond.filter(x=>x.type!=='positivo');
 const areas=a=>{const m={};a.forEach(x=>{if(x.area)m[x.area]=(m[x.area]||0)+1});return Object.entries(m).sort((p,q)=>q[1]-p[1]).map(([k,n])=>k+(n>1?` (${n})`:''))};
 const home=(c.home||[]).filter(h=>inP(h.due,from,to)||inP(h.at,from,to));const homeDone=home.filter(h=>h.done).length;
 const goals=(c.goals||[]).map(g=>({area:g.area,t:g.t,p:+g.p||0}));
 return {done:done.map(x=>({date:String(x.date).slice(0,10),mode:x.mode||'',worked:x.worked||'',ach:x.ach||'',home:x.home||''})),abs,canc,next,
  cond:{pos:pos.length,neg:neg.length,posAreas:areas(pos),negAreas:areas(neg),items:cond.slice(-6).map(x=>({date:String(x.date).slice(0,10),type:x.type,area:x.area||'',txt:x.abc?(x.abc.b||''):(x.note||''),s:x.abc?x.abc.s||'':''}))},
  home:{n:home.length,done:homeDone,list:home.map(h=>({t:h.t,done:!!h.done}))},goals}}
function draftTexts32(sid,kind,P,pr){const k=UP(sid),n=k.name.split(' ')[0];const cur=pr&&TODAY>=pr.from&&TODAY<=pr.to;const per=kind==='week'?(cur?'esta semana':`la semana del ${fd(pr.from)} al ${fd(pr.to)}`):(cur?'este mes':MESL32[+pr.from.slice(5,7)-1]+' de '+pr.from.slice(0,4));
 const temas=[...new Set(P.done.map(x=>String(x.worked).split(/\n|\.|;/)[0].trim()).filter(Boolean))].slice(0,5);
 let sint=P.done.length?`Durante ${per}, ${n} participó en ${P.done.length} sesi${P.done.length===1?'ón':'ones'} de acompañamiento psicopedagógico.`:`Durante ${per} no hubo sesiones realizadas con ${n}.`;if(temas.length)sint+=` Trabajamos: ${temas.join('; ')}.`;
 if(P.cond.pos)sint+=` Se registraron ${P.cond.pos} conducta${P.cond.pos===1?'':'s'} positiva${P.cond.pos===1?'':'s'}${P.cond.posAreas.length?` (${P.cond.posAreas.join(', ')})`:''}.`;
 if(P.home.n)sint+=` Completó ${P.home.done} de ${P.home.n} tarea${P.home.n===1?'':'s'} para casa.`;
 const logros=P.done.map(x=>x.ach).filter(Boolean).map(t=>'• '+String(t).trim()).slice(-6).join('\n');
 const fort=P.cond.negAreas.length?`• Seguiremos acompañando: ${P.cond.negAreas.join(', ')}.`:'';
 const casa=[...new Set(P.done.map(x=>x.home).filter(Boolean).map(t=>'• '+String(t).trim()))].slice(-5).join('\n');
 return {sint,logros,fort,casa}}
